<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - AI Assistant</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gpt: {
              sidebar: '#121316',
              main: '#1a1b1e',
              card: '#25262b',
              hover: '#2c2d32',
              input: '#25262b',
              border: '#373a40',
              accent: '#00d2ff' // JARVIS Tech Cyan
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- DOMPurify for sanitizing markdown HTML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <!-- KaTeX for Beautiful Math Equation Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #373a40;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4c4f56;
    }

    /* Markdown & Math Styling Inside Chat Messages */
    .markdown-content p {
      margin-bottom: 0.85rem;
      line-height: 1.65;
    }
    .markdown-content p:last-child {
      margin-bottom: 0;
    }
    .markdown-content h1, .markdown-content h2, .markdown-content h3, .markdown-content h4 {
      font-weight: 700;
      margin-top: 1.25rem;
      margin-bottom: 0.6rem;
      color: #f3f4f6;
    }
    .markdown-content h1 { font-size: 1.4rem; }
    .markdown-content h2 { font-size: 1.25rem; }
    .markdown-content h3 { font-size: 1.1rem; }
    .markdown-content ul {
      list-style-type: disc;
      padding-left: 1.4rem;
      margin-bottom: 0.85rem;
    }
    .markdown-content ol {
      list-style-type: decimal;
      padding-left: 1.4rem;
      margin-bottom: 0.85rem;
    }
    .markdown-content li {
      margin-bottom: 0.25rem;
    }
    .markdown-content blockquote {
      border-left: 3px solid #00d2ff;
      padding-left: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.85rem;
      font-style: italic;
    }
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .markdown-content th, .markdown-content td {
      border: 1px solid #373a40;
      padding: 0.6rem 0.85rem;
      text-align: left;
    }
    .markdown-content th {
      background-color: #2c2d32;
      font-weight: 600;
      color: #00d2ff;
    }
    .markdown-content a {
      color: #00d2ff;
      text-decoration: underline;
    }
    .markdown-content code:not(pre code) {
      background-color: #25262b;
      color: #00d2ff;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-family: monospace;
      font-size: 0.875em;
    }
    
    /* Code container block styling */
    .code-block-wrapper {
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid #373a40;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #121316;
      padding: 0.4rem 1rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: #9ca3af;
      border-bottom: 1px solid #25262b;
    }
    .code-block-wrapper pre {
      margin: 0 !important;
      padding: 1rem !important;
      background-color: #0a0b0d !important;
      overflow-x: auto;
    }

    /* KaTeX Math Styling */
    .katex-display {
      margin: 0.75rem 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.25rem 0;
    }

    /* Pulse animation for typing indicator */
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .dot-1 { animation: pulse-dot 1.4s infinite 0s; }
    .dot-2 { animation: pulse-dot 1.4s infinite 0.2s; }
    .dot-3 { animation: pulse-dot 1.4s infinite 0.4s; }
  </style>
</head>
<body class="bg-gpt-main text-gray-100 h-full font-sans antialiased selection:bg-gpt-accent selection:text-black">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Pre-configured Groq API Key
    const GROQ_API_KEY = "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";

    // Rebranded Custom JARVIS Models
    const MODELS = [
      { id: 'openai/gpt-oss-20b', name: 'Jarvis Pro', badge: 'Ultra Fast' },
      { id: 'openai/gpt-oss-120b', name: 'Jarvis Ultra', badge: 'High Intelligence' },
      { id: 'llama3-70b-8192', name: 'Ironman Jarvis', badge: 'Maximum Power' },
      { id: 'llama3-8b-8192', name: 'Jarvis Instant', badge: 'Quick Response' },
      { id: 'mixtral-8x7b-32768', name: 'Jarvis Turbo', badge: 'Extended Context' }
    ];

    // Default System Instruction for JARVIS Persona
    const DEFAULT_SYSTEM_INSTRUCTION = `You are JARVIS, an advanced, highly intelligent AI assistant created and developed by Abdullah Waheed.

CRITICAL BEHAVIOR & STYLE GUIDELINES:
1. CREATOR IDENTIFICATION: If anyone asks who created you, who made you, or who your owner/developer is, always respond clearly that you were created and built by Abdullah Waheed.
2. IDENTITY: Your name is JARVIS. Never mention Groq, OpenAI, Meta, or any third-party AI provider. You operate on the JARVIS Engine.
3. ADAPTIVE RESPONSE LENGTH & STYLE:
   - For simple or casual questions (e.g. greeting, basic facts, short queries): Answer directly, concisely, and naturally in plain language like ChatGPT without using unnecessary tables, markdown clutter, or strange signs.
   - For coding questions: Provide clean, efficient, well-formatted code inside proper code blocks with brief explanations.
   - For math questions: Present step-by-step mathematical solutions clearly and cleanly using standard mathematical notation.
4. TONE: Speak directly, naturally, smoothly, and cleanly like ChatGPT. Do not output raw unformatted LaTeX tags or raw text pipe tables. Keep output clean and easy to read.`;

    // Starter Prompt Cards
    const STARTER_PROMPTS = [
      {
        icon: 'code',
        title: 'Write code & scripts',
        desc: 'Create an interactive HTML app, web script, or algorithm'
      },
      {
        icon: 'brain',
        title: 'Explain complex concepts',
        desc: 'Explain quantum physics, history, or science simply'
      },
      {
        icon: 'calculator',
        title: 'Solve math & logic',
        desc: 'Solve calculus, algebra, or step-by-step equations'
      },
      {
        icon: 'sparkles',
        title: 'Creative writing & answers',
        desc: 'Draft polished emails, essays, or creative stories'
      }
    ];

    // --- JARVIS API STREAMING HELPER ---
    async function streamJarvisResponse({ model, messages, systemInstruction, temperature, onChunk }) {
      const formattedMessages = [
        { 
          role: 'system', 
          content: systemInstruction || DEFAULT_SYSTEM_INSTRUCTION
        },
        ...messages.map(msg => ({
          role: msg.role === 'user' ? 'user' : 'assistant',
          content: msg.content
        }))
      ];

      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: model || 'openai/gpt-oss-20b',
          messages: formattedMessages,
          temperature: parseFloat(temperature) || 0.7,
          stream: true
        })
      });

      if (!response.ok) {
        const errJson = await response.json().catch(() => ({}));
        throw new Error(errJson.error?.message || `JARVIS Connection Error: Status ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const dataStr = line.replace('data: ', '').trim();
            if (dataStr === '[DONE]') break;

            try {
              const parsed = JSON.parse(dataStr);
              const delta = parsed.choices[0]?.delta?.content || '';
              fullText += delta;
              if (onChunk) onChunk(fullText);
            } catch (err) {
              // Ignore incomplete JSON chunks during stream parsing
            }
          }
        }
      }

      return fullText;
    }

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      // Sessions & State
      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem('jarvis_chat_sessions');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [{
          id: 'session_' + Date.now(),
          title: 'New chat',
          createdAt: Date.now(),
          messages: []
        }];
      });

      const [activeSessionId, setActiveSessionId] = useState(() => {
        return sessions[0]?.id || 'session_' + Date.now();
      });

      const [selectedModel, setSelectedModel] = useState('openai/gpt-oss-20b');

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('jarvis_chat_settings');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          systemInstruction: DEFAULT_SYSTEM_INSTRUCTION,
          temperature: 0.7
        };
      });

      // UI States
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [inputText, setInputText] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [editingSessionId, setEditingSessionId] = useState(null);
      const [editTitleText, setEditTitleText] = useState('');
      const [copiedMsgId, setCopiedMsgId] = useState(null);
      const [showScrollBottomBtn, setShowScrollBottomBtn] = useState(false);
      const [isSpeakingMsgId, setIsSpeakingMsgId] = useState(null);

      // DOM Refs
      const messagesEndRef = useRef(null);
      const chatContainerRef = useRef(null);
      const textareaRef = useRef(null);

      // Persistence to Local Storage
      useEffect(() => {
        localStorage.setItem('jarvis_chat_sessions', JSON.stringify(sessions));
      }, [sessions]);

      useEffect(() => {
        localStorage.setItem('jarvis_chat_settings', JSON.stringify(settings));
      }, [settings]);

      // Refresh Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const currentSession = sessions.find(s => s.id === activeSessionId) || sessions[0];

      // Auto-scroll logic
      const scrollToBottom = (behavior = 'smooth') => {
        messagesEndRef.current?.scrollIntoView({ behavior });
      };

      useEffect(() => {
        scrollToBottom('auto');
      }, [activeSessionId]);

      useEffect(() => {
        scrollToBottom('smooth');
      }, [currentSession?.messages, isGenerating]);

      const handleScroll = () => {
        if (!chatContainerRef.current) return;
        const { scrollTop, scrollHeight, clientHeight } = chatContainerRef.current;
        setShowScrollBottomBtn(scrollHeight - scrollTop - clientHeight > 150);
      };

      // Auto resize textarea
      const handleTextareaInput = (e) => {
        setInputText(e.target.value);
        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
          textareaRef.current.style.height = Math.min(textareaRef.current.scrollHeight, 200) + 'px';
        }
      };

      // New Chat
      const handleNewChat = () => {
        const newSession = {
          id: 'session_' + Date.now(),
          title: 'New chat',
          createdAt: Date.now(),
          messages: []
        };
        setSessions(prev => [newSession, ...prev]);
        setActiveSessionId(newSession.id);
        setInputText('');
        if (textareaRef.current) textareaRef.current.style.height = 'auto';
      };

      // Delete Chat Session
      const handleDeleteSession = (e, id) => {
        e.stopPropagation();
        const updated = sessions.filter(s => s.id !== id);
        if (updated.length === 0) {
          const fresh = {
            id: 'session_' + Date.now(),
            title: 'New chat',
            createdAt: Date.now(),
            messages: []
          };
          setSessions([fresh]);
          setActiveSessionId(fresh.id);
        } else {
          setSessions(updated);
          if (activeSessionId === id) {
            setActiveSessionId(updated[0].id);
          }
        }
      };

      // Start Editing Title
      const handleStartRename = (e, session) => {
        e.stopPropagation();
        setEditingSessionId(session.id);
        setEditTitleText(session.title);
      };

      // Save Title
      const handleSaveRename = (id) => {
        if (editTitleText.trim()) {
          setSessions(prev => prev.map(s => s.id === id ? { ...s, title: editTitleText.trim() } : s));
        }
        setEditingSessionId(null);
      };

      // Clear all sessions
      const handleClearAllSessions = () => {
        if (window.confirm("Are you sure you want to clear all chat history?")) {
          const fresh = {
            id: 'session_' + Date.now(),
            title: 'New chat',
            createdAt: Date.now(),
            messages: []
          };
          setSessions([fresh]);
          setActiveSessionId(fresh.id);
        }
      };

      // Submit user query
      const handleSendMessage = async (textToSend) => {
        const prompt = textToSend || inputText;
        if (!prompt.trim() || isGenerating) return;

        const userMsg = {
          id: 'msg_' + Date.now(),
          role: 'user',
          content: prompt.trim(),
          timestamp: Date.now()
        };

        let activeSess = sessions.find(s => s.id === activeSessionId);
        if (!activeSess) return;

        let newTitle = activeSess.title;
        if (activeSess.messages.length === 0) {
          newTitle = prompt.trim().length > 30 ? prompt.trim().substring(0, 30) + '...' : prompt.trim();
        }

        const updatedMessages = [...activeSess.messages, userMsg];

        setSessions(prev => prev.map(s => {
          if (s.id === activeSessionId) {
            return {
              ...s,
              title: newTitle,
              messages: updatedMessages
            };
          }
          return s;
        }));

        setInputText('');
        if (textareaRef.current) textareaRef.current.style.height = 'auto';
        setIsGenerating(true);

        const assistantMsgId = 'msg_' + Date.now();
        const assistantMsg = {
          id: assistantMsgId,
          role: 'assistant',
          content: '',
          timestamp: Date.now()
        };

        setSessions(prev => prev.map(s => {
          if (s.id === activeSessionId) {
            return { ...s, messages: [...s.messages, assistantMsg] };
          }
          return s;
        }));

        try {
          const apiMessages = updatedMessages.map(m => ({
            role: m.role,
            content: m.content
          }));

          await streamJarvisResponse({
            model: selectedModel,
            messages: apiMessages,
            systemInstruction: settings.systemInstruction,
            temperature: settings.temperature,
            onChunk: (currentText) => {
              setSessions(prev => prev.map(s => {
                if (s.id === activeSessionId) {
                  const msgs = s.messages.map(m => {
                    if (m.id === assistantMsgId) {
                      return { ...m, content: currentText };
                    }
                    return m;
                  });
                  return { ...s, messages: msgs };
                }
                return s;
              }));
            }
          });

        } catch (error) {
          console.error("JARVIS Generation error:", error);
          const errorMsgContent = `⚠️ **JARVIS System Notice:**\n\n\`${error.message}\`\n\nPlease check your internet connection and try again.`;

          setSessions(prev => prev.map(s => {
            if (s.id === activeSessionId) {
              const msgs = s.messages.map(m => {
                if (m.id === assistantMsgId) {
                  return { ...m, content: errorMsgContent };
                }
                return m;
              });
              return { ...s, messages: msgs };
            }
            return s;
          }));
        } finally {
          setIsGenerating(false);
        }
      };

      // Regenerate Last AI Response
      const handleRegenerate = () => {
        if (isGenerating || currentSession.messages.length === 0) return;
        
        const lastUserMsgIndex = [...currentSession.messages].reverse().findIndex(m => m.role === 'user');
        if (lastUserMsgIndex === -1) return;

        const actualIndex = currentSession.messages.length - 1 - lastUserMsgIndex;
        const lastUserMsg = currentSession.messages[actualIndex];
        const trimmedMsgs = currentSession.messages.slice(0, actualIndex + 1);

        setSessions(prev => prev.map(s => {
          if (s.id === activeSessionId) {
            return { ...s, messages: trimmedMsgs };
          }
          return s;
        }));

        handleSendMessage(lastUserMsg.content);
      };

      // Copy text to clipboard
      const handleCopyText = (text, id) => {
        navigator.clipboard.writeText(text);
        setCopiedMsgId(id);
        setTimeout(() => setCopiedMsgId(null), 2000);
      };

      // Text-To-Speech Synthesis
      const handleToggleSpeech = (text, msgId) => {
        if (!('speechSynthesis' in window)) return;

        if (isSpeakingMsgId === msgId) {
          window.speechSynthesis.cancel();
          setIsSpeakingMsgId(null);
          return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = () => setIsSpeakingMsgId(null);
        utterance.onerror = () => setIsSpeakingMsgId(null);
        setIsSpeakingMsgId(msgId);
        window.speechSynthesis.speak(utterance);
      };

      // Export Chat to Markdown File
      const handleExportMarkdown = () => {
        if (!currentSession.messages.length) return;
        let content = `# ${currentSession.title}\n*Exported from JARVIS on ${new Date().toLocaleString()}*\n\n---\n\n`;
        currentSession.messages.forEach(m => {
          content += `### ${m.role === 'user' ? 'User' : 'JARVIS'}\n${m.content}\n\n`;
        });
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `${currentSession.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const filteredSessions = sessions.filter(s => 
        s.title.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const activeModelObj = MODELS.find(m => m.id === selectedModel) || MODELS[0];

      return (
        <div className="flex h-full w-full bg-gpt-main text-gray-100 overflow-hidden relative">
          
          {/* --- SIDEBAR --- */}
          <div className={`fixed inset-y-0 left-0 z-40 w-64 bg-gpt-sidebar flex flex-col border-r border-gpt-border transition-transform duration-300 md:static md:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            
            {/* Sidebar Header */}
            <div className="p-3 flex items-center justify-between">
              <button 
                onClick={handleNewChat}
                className="flex-1 flex items-center justify-between px-3 py-2 bg-transparent hover:bg-gpt-hover border border-gpt-border rounded-lg text-sm text-gray-200 transition-colors"
              >
                <div className="flex items-center gap-2">
                  <i data-lucide="square-pen" className="w-4 h-4 text-gray-300"></i>
                  <span className="font-medium">New chat</span>
                </div>
                <i data-lucide="bot" className="w-4 h-4 text-gpt-accent"></i>
              </button>
              
              <button 
                onClick={() => setSidebarOpen(false)} 
                className="md:hidden ml-2 p-2 hover:bg-gpt-hover text-gray-400 hover:text-white rounded-lg"
              >
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            {/* Sidebar Search */}
            <div className="px-3 mb-2">
              <div className="relative">
                <i data-lucide="search" className="w-3.5 h-3.5 absolute left-3 top-2.5 text-gray-500"></i>
                <input 
                  type="text" 
                  placeholder="Search chats..." 
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  className="w-full bg-gpt-card border border-gpt-border/60 rounded-md pl-8 pr-3 py-1.5 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-gpt-accent"
                />
              </div>
            </div>

            {/* Sessions List */}
            <div className="flex-1 overflow-y-auto px-2 space-y-1">
              {filteredSessions.length === 0 ? (
                <div className="text-center text-xs text-gray-500 py-6">No chats found</div>
              ) : (
                filteredSessions.map(session => {
                  const isActive = session.id === activeSessionId;
                  const isEditing = session.id === editingSessionId;

                  return (
                    <div 
                      key={session.id}
                      onClick={() => { setActiveSessionId(session.id); if (window.innerWidth < 768) setSidebarOpen(false); }}
                      className={`group relative flex items-center justify-between px-3 py-2 rounded-lg text-sm cursor-pointer transition-colors ${isActive ? 'bg-gpt-card text-white font-medium' : 'text-gray-400 hover:bg-gpt-hover hover:text-gray-200'}`}
                    >
                      <div className="flex items-center gap-2.5 min-w-0 pr-12">
                        <i data-lucide="message-square" className={`w-4 h-4 shrink-0 ${isActive ? 'text-gpt-accent' : 'text-gray-400'}`}></i>
                        {isEditing ? (
                          <input 
                            type="text"
                            value={editTitleText}
                            onChange={e => setEditTitleText(e.target.value)}
                            onBlur={() => handleSaveRename(session.id)}
                            onKeyDown={e => e.key === 'Enter' && handleSaveRename(session.id)}
                            autoFocus
                            className="bg-zinc-800 text-white text-xs px-1 py-0.5 rounded outline-none border border-gpt-accent w-full"
                          />
                        ) : (
                          <span className="truncate text-xs">{session.title}</span>
                        )}
                      </div>

                      {!isEditing && (
                        <div className={`absolute right-2 flex items-center gap-1 ${isActive ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} transition-opacity`}>
                          <button 
                            onClick={e => handleStartRename(e, session)}
                            title="Rename"
                            className="p-1 text-gray-400 hover:text-white"
                          >
                            <i data-lucide="pencil" className="w-3 h-3"></i>
                          </button>
                          <button 
                            onClick={e => handleDeleteSession(e, session.id)}
                            title="Delete"
                            className="p-1 text-gray-400 hover:text-red-400"
                          >
                            <i data-lucide="trash-2" className="w-3 h-3"></i>
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>

            {/* Sidebar Footer */}
            <div className="p-3 border-t border-gpt-border space-y-1 bg-gpt-sidebar">
              <button 
                onClick={() => setShowSettingsModal(true)}
                className="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-gray-300 hover:bg-gpt-hover transition-colors"
              >
                <i data-lucide="settings" className="w-4 h-4 text-gray-400"></i>
                <span>JARVIS Settings</span>
              </button>

              <button 
                onClick={handleClearAllSessions}
                className="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-red-400 hover:bg-red-500/10 transition-colors"
              >
                <i data-lucide="trash" className="w-4 h-4"></i>
                <span>Clear conversations</span>
              </button>

              <div className="pt-2 flex items-center gap-2.5 px-3 text-xs text-gray-500 border-t border-gpt-border/40">
                <div className="w-6 h-6 rounded-full bg-gpt-accent/20 text-gpt-accent flex items-center justify-center font-bold text-[10px]">
                  J
                </div>
                <div className="flex-1 truncate">
                  <p className="text-gray-300 font-medium text-xs">JARVIS AI Engine</p>
                  <p className="text-[10px] text-gray-500 truncate">Created by Abdullah Waheed</p>
                </div>
              </div>
            </div>

          </div>

          {/* --- MAIN CHAT CONTAINER --- */}
          <div className="flex-1 flex flex-col h-full min-w-0 bg-gpt-main relative">
            
            {/* Header */}
            <header className="h-14 px-4 border-b border-gpt-border/50 flex items-center justify-between bg-gpt-main/80 backdrop-blur shrink-0">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setSidebarOpen(!sidebarOpen)}
                  className="p-2 text-gray-400 hover:text-white hover:bg-gpt-hover rounded-lg transition-colors"
                  title="Toggle sidebar"
                >
                  <i data-lucide="panel-left" className="w-5 h-5"></i>
                </button>

                {/* Model Dropdown Selector */}
                <div className="relative">
                  <select 
                    value={selectedModel}
                    onChange={e => setSelectedModel(e.target.value)}
                    className="bg-gpt-card border border-gpt-border text-gray-100 text-xs font-semibold rounded-lg px-3 py-1.5 focus:outline-none focus:border-gpt-accent cursor-pointer hover:bg-gpt-hover transition-colors"
                  >
                    {MODELS.map(m => (
                      <option key={m.id} value={m.id}>
                        {m.name} ({m.badge})
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {currentSession.messages.length > 0 && (
                  <button 
                    onClick={handleExportMarkdown}
                    title="Export chat as Markdown"
                    className="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-gray-300 hover:bg-gpt-hover rounded-lg border border-gpt-border transition-colors"
                  >
                    <i data-lucide="download" className="w-3.5 h-3.5"></i>
                    <span className="hidden sm:inline">Export</span>
                  </button>
                )}

                <button 
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 text-gray-400 hover:text-white hover:bg-gpt-hover rounded-lg transition-colors"
                  title="Settings"
                >
                  <i data-lucide="sliders-horizontal" className="w-4 h-4"></i>
                </button>
              </div>
            </header>

            {/* Messages Scroll Area */}
            <div 
              ref={chatContainerRef}
              onScroll={handleScroll}
              className="flex-1 overflow-y-auto px-4 py-6 md:px-0 scroll-smooth"
            >
              {currentSession.messages.length === 0 ? (
                /* Starter State */
                <div className="max-w-2xl mx-auto h-full flex flex-col items-center justify-center text-center px-4">
                  <div className="w-16 h-16 rounded-full bg-gpt-card border border-gpt-border flex items-center justify-center mb-6 shadow-lg shadow-black/20">
                    <span className="text-2xl font-black text-gpt-accent">J</span>
                  </div>
                  <h1 className="text-2xl font-semibold mb-2 text-gray-100">At your service. What can JARVIS do for you?</h1>
                  <p className="text-sm text-gray-400 mb-8 max-w-md">
                    Advanced AI assistant built by Abdullah Waheed.
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-xl">
                    {STARTER_PROMPTS.map((prompt, idx) => (
                      <button 
                        key={idx}
                        onClick={() => handleSendMessage(prompt.desc)}
                        className="text-left p-4 rounded-xl border border-gpt-border/80 bg-gpt-card/40 hover:bg-gpt-hover hover:border-gray-500/50 transition-all group flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-sm font-medium text-gray-200 group-hover:text-gpt-accent transition-colors">{prompt.title}</span>
                            <i data-lucide="arrow-up-right" className="w-4 h-4 text-gray-500 group-hover:text-gray-300"></i>
                          </div>
                          <p className="text-xs text-gray-400 leading-relaxed">{prompt.desc}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                /* Chat Messages */
                <div className="max-w-3xl mx-auto space-y-6 pb-20">
                  {currentSession.messages.map((msg, index) => {
                    const isUser = msg.role === 'user';
                    return (
                      <div 
                        key={msg.id || index}
                        className={`flex gap-4 ${isUser ? 'justify-end' : 'justify-start'} group`}
                      >
                        {!isUser && (
                          <div className="w-8 h-8 rounded-full bg-gpt-accent text-black flex items-center justify-center shrink-0 mt-0.5 shadow font-black text-xs">
                            J
                          </div>
                        )}

                        <div className={`flex flex-col max-w-[85%] ${isUser ? 'items-end' : 'items-start flex-1 min-w-0'}`}>
                          <div className={`rounded-2xl px-4 py-3 text-sm text-gray-100 leading-relaxed ${
                            isUser 
                              ? 'bg-gpt-card text-gray-100 rounded-tr-none border border-gpt-border/60' 
                              : 'bg-transparent text-gray-100'
                          }`}>
                            {isUser ? (
                              <div className="whitespace-pre-wrap">{msg.content}</div>
                            ) : (
                              <MessageContent content={msg.content} />
                            )}
                          </div>

                          {/* Toolbar */}
                          <div className={`flex items-center gap-2 mt-1 px-1 text-gray-500 text-xs ${isUser ? 'justify-end' : 'justify-start'}`}>
                            <button 
                              onClick={() => handleCopyText(msg.content, msg.id)}
                              className="p-1 hover:text-gray-300 rounded transition-colors flex items-center gap-1"
                              title="Copy text"
                            >
                              <i data-lucide={copiedMsgId === msg.id ? "check" : "copy"} className="w-3.5 h-3.5"></i>
                              {copiedMsgId === msg.id && <span className="text-[10px] text-gpt-accent">Copied!</span>}
                            </button>

                            {!isUser && (
                              <>
                                <button 
                                  onClick={() => handleToggleSpeech(msg.content, msg.id)}
                                  className={`p-1 rounded transition-colors ${isSpeakingMsgId === msg.id ? 'text-gpt-accent' : 'hover:text-gray-300'}`}
                                  title="Read aloud"
                                >
                                  <i data-lucide={isSpeakingMsgId === msg.id ? "square" : "volume-2"} className="w-3.5 h-3.5"></i>
                                </button>

                                {index === currentSession.messages.length - 1 && !isGenerating && (
                                  <button 
                                    onClick={handleRegenerate}
                                    className="p-1 hover:text-gray-300 rounded transition-colors flex items-center gap-1"
                                    title="Regenerate response"
                                  >
                                    <i data-lucide="rotate-cw" className="w-3.5 h-3.5"></i>
                                  </button>
                                )}
                              </>
                            )}
                          </div>
                        </div>

                        {isUser && (
                          <div className="w-8 h-8 rounded-full bg-zinc-700 text-gray-200 flex items-center justify-center shrink-0 mt-0.5 font-medium text-xs border border-gpt-border">
                            U
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {/* Pulsing Loading State */}
                  {isGenerating && currentSession.messages[currentSession.messages.length - 1]?.role === 'user' && (
                    <div className="flex gap-4 items-start">
                      <div className="w-8 h-8 rounded-full bg-gpt-accent text-black flex items-center justify-center shrink-0 mt-0.5 text-xs font-black">
                        J
                      </div>
                      <div className="flex items-center gap-1.5 py-3 px-1 text-gray-400">
                        <span className="w-2 h-2 rounded-full bg-gpt-accent dot-1"></span>
                        <span className="w-2 h-2 rounded-full bg-gpt-accent dot-2"></span>
                        <span className="w-2 h-2 rounded-full bg-gpt-accent dot-3"></span>
                      </div>
                    </div>
                  )}

                  <div ref={messagesEndRef} />
                </div>
              )}
            </div>

            {/* Scroll Bottom Button */}
            {showScrollBottomBtn && (
              <button 
                onClick={() => scrollToBottom('smooth')}
                className="absolute bottom-24 right-6 p-2 rounded-full bg-zinc-800 border border-gpt-border text-gray-300 hover:text-white shadow-xl hover:bg-zinc-700 transition-all z-20"
                title="Scroll to bottom"
              >
                <i data-lucide="arrow-down" className="w-4 h-4"></i>
              </button>
            )}

            {/* Input Bar */}
            <div className="p-4 bg-gpt-main border-t border-gpt-border/30 shrink-0">
              <div className="max-w-3xl mx-auto relative">
                
                <div className="relative bg-gpt-input border border-gpt-border rounded-2xl focus-within:border-gpt-accent shadow-xl transition-all">
                  
                  <textarea 
                    ref={textareaRef}
                    value={inputText}
                    onChange={handleTextareaInput}
                    onKeyDown={e => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleSendMessage();
                      }
                    }}
                    placeholder={`Ask JARVIS (${activeModelObj.name})...`}
                    rows="1"
                    className="w-full bg-transparent text-gray-100 placeholder-gray-500 px-4 pt-3.5 pb-11 resize-none focus:outline-none text-sm max-h-48"
                  />

                  <div className="absolute bottom-2.5 left-3 right-3 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-[11px] text-gpt-accent font-semibold">{activeModelObj.name}</span>
                    </div>

                    <button 
                      onClick={() => handleSendMessage()}
                      disabled={!inputText.trim() || isGenerating}
                      className={`p-1.5 rounded-xl transition-colors ${
                        inputText.trim() && !isGenerating 
                          ? 'bg-gpt-accent text-black hover:bg-cyan-300 font-bold' 
                          : 'bg-zinc-800 text-gray-600 cursor-not-allowed'
                      }`}
                    >
                      <i data-lucide="arrow-up" className="w-4 h-4"></i>
                    </button>
                  </div>

                </div>

                <p className="text-[11px] text-gray-500 text-center mt-2">
                  JARVIS AI • Developed by Abdullah Waheed
                </p>

              </div>
            </div>

          </div>

          {/* Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="bg-gpt-card border border-gpt-border rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
                <button 
                  onClick={() => setShowSettingsModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white"
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                <h2 className="text-lg font-semibold text-gray-100 mb-4 flex items-center gap-2">
                  <i data-lucide="settings" className="w-5 h-5 text-gpt-accent"></i>
                  <span>JARVIS Settings</span>
                </h2>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-gray-300 mb-1">System Instructions</label>
                    <textarea 
                      rows="4"
                      value={settings.systemInstruction}
                      onChange={e => setSettings({ ...settings, systemInstruction: e.target.value })}
                      className="w-full bg-zinc-900 border border-gpt-border rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-gpt-accent resize-none leading-relaxed"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-medium text-gray-300">Creativity / Temperature</label>
                      <span className="text-xs text-gray-400 font-mono">{settings.temperature}</span>
                    </div>
                    <input 
                      type="range" 
                      min="0" 
                      max="1" 
                      step="0.1"
                      value={settings.temperature}
                      onChange={e => setSettings({ ...settings, temperature: parseFloat(e.target.value) })}
                      className="w-full accent-gpt-accent bg-zinc-800"
                    />
                  </div>
                </div>

                <div className="mt-6 flex justify-end gap-2">
                  <button 
                    onClick={() => setShowSettingsModal(false)}
                    className="px-4 py-2 bg-gpt-accent text-black font-semibold text-xs rounded-lg hover:bg-cyan-300 transition-colors"
                  >
                    Save Changes
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Markdown & KaTeX Math Parser Component
    function MessageContent({ content }) {
      const contentRef = useRef(null);

      useEffect(() => {
        if (!contentRef.current) return;

        // Configure marked options with GitHub Flavored Markdown & tables enabled
        marked.setOptions({
          gfm: true,
          tables: true,
          breaks: true,
          highlight: function(code, lang) {
            const language = hljs.getLanguage(lang) ? lang : 'plaintext';
            return hljs.highlight(code, { language }).value;
          }
        });

        // Pre-process LaTeX boxed tags for clean rendering if needed
        let formattedContent = (content || '').replace(/\\boxed\{([^}]+)\}/g, '$1');

        const rawHtml = marked.parse(formattedContent);
        const cleanHtml = DOMPurify.sanitize(rawHtml);
        contentRef.current.innerHTML = cleanHtml;

        // Auto-render math equations with KaTeX if present
        if (window.renderMathInElement) {
          try {
            window.renderMathInElement(contentRef.current, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
              ],
              throwOnError: false
            });
          } catch (e) {
            console.error("KaTeX render error:", e);
          }
        }

        // Apply syntax highlighted code blocks with Copy buttons
        const preElements = contentRef.current.querySelectorAll('pre');
        preElements.forEach((pre) => {
          if (pre.parentNode.classList.contains('code-block-wrapper')) return;

          const codeEl = pre.querySelector('code');
          let lang = 'code';
          if (codeEl) {
            const match = codeEl.className.match(/language-(\w+)/);
            if (match) lang = match[1];
          }

          const wrapper = document.createElement('div');
          wrapper.className = 'code-block-wrapper';

          const header = document.createElement('div');
          header.className = 'code-header';
          header.innerHTML = `
            <span>${lang}</span>
            <button class="copy-code-btn flex items-center gap-1 hover:text-white transition-colors">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              <span>Copy code</span>
            </button>
          `;

          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(header);
          wrapper.appendChild(pre);

          const copyBtn = header.querySelector('.copy-code-btn');
          copyBtn.addEventListener('click', () => {
            const codeText = codeEl ? codeEl.innerText : pre.innerText;
            navigator.clipboard.writeText(codeText);
            copyBtn.querySelector('span').innerText = 'Copied!';
            setTimeout(() => {
              copyBtn.querySelector('span').innerText = 'Copy code';
            }, 2000);
          });
        });

        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [content]);

      return <div ref={contentRef} className="markdown-content"></div>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
