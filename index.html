<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI - Created by Abdullah Waheed</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Highlight.js for Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Marked.js for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX for Math Equation Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    .markdown-body p { margin-bottom: 0.75rem; }
    .markdown-body pre { background: #0f172a; padding: 1rem; border-radius: 0.75rem; margin: 0.75rem 0; border: 1px solid #1e293b; overflow-x: auto; }
    .markdown-body code { font-family: monospace; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.5rem 0.75rem; text-align: left; }
    .markdown-body th { background-color: #1e293b; }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden bg-slate-950">

  <!-- TOP HEADER -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-4 z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center font-bold text-cyan-400">J</div>
      <div>
        <h1 class="font-bold text-sm tracking-wide text-white flex items-center gap-2">
          JARVIS AI <span class="text-[10px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-1.5 py-0.5 rounded font-mono">PRO</span>
        </h1>
        <p class="text-[10px] text-slate-400">By Abdullah Waheed</p>
      </div>
    </div>

    <!-- MODEL SELECTOR -->
    <div class="flex items-center gap-3">
      <select id="modelSelect" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-500">
        <option value="llama-3.1-8b-instant" selected>Jarvis Instant (Ultra Fast)</option>
        <option value="llama3-70b-8192">Jarvis Pro (High Intelligence)</option>
        <option value="mixtral-8x7b-32768">Ironman Jarvis (Deep Reasoning)</option>
      </select>

      <!-- AUTH BUTTON -->
      <button id="authBtn" onclick="openAuthModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3.5 py-1.5 rounded-lg font-medium transition shadow-lg shadow-cyan-600/20">
        Sign In
      </button>
    </div>
  </header>

  <!-- MAIN BODY -->
  <div class="flex-1 flex overflow-hidden">
    <!-- SIDEBAR -->
    <aside class="w-64 border-r border-slate-800 bg-slate-900/50 flex flex-col hidden md:flex">
      <div class="p-3 border-b border-slate-800/60">
        <button onclick="startNewChat()" class="w-full flex items-center justify-between bg-cyan-600/10 border border-cyan-500/30 hover:bg-cyan-600/20 text-cyan-300 px-3 py-2 rounded-xl text-xs font-semibold transition">
          <span>+ New Chat</span>
          <span class="text-[10px] opacity-60">Ctrl+K</span>
        </button>
      </div>

      <!-- ACCOUNT STATUS BADGE -->
      <div id="accountStatusBanner" class="px-3 py-2 bg-amber-500/10 border-b border-amber-500/20 flex items-center justify-between text-xs text-amber-300">
        <span>● Guest Mode</span>
        <button onclick="openAuthModal()" class="underline text-[11px] font-semibold">Sign In</button>
      </div>

      <!-- SAVED CONVERSATIONS LIST -->
      <div class="flex-1 overflow-y-auto p-3 space-y-1" id="chatHistoryList">
        <p class="text-[11px] text-slate-500 px-2 py-1 font-mono uppercase tracking-wider">Saved Conversations</p>
        <div id="historyItems" class="space-y-1"></div>
      </div>

      <!-- FOOTER USER PROFILE -->
      <div class="p-3 border-t border-slate-800 bg-slate-900/80 flex items-center justify-between">
        <div class="flex items-center gap-2 overflow-hidden">
          <div id="userAvatar" class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs text-slate-300 font-bold">G</div>
          <div class="truncate">
            <p id="userName" class="text-xs font-medium text-slate-200 truncate">Guest User</p>
            <p id="userSub" class="text-[10px] text-slate-500 truncate">Sign in to save history</p>
          </div>
        </div>
        <button id="logoutBtn" onclick="handleLogout()" class="hidden text-slate-400 hover:text-red-400 text-xs p-1" title="Sign Out">➜]</button>
      </div>
    </aside>

    <!-- CHAT CONTAINER -->
    <main class="flex-1 flex flex-col bg-slate-950 relative">
      <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl mx-auto w-full"></div>

      <!-- INPUT FORM -->
      <div class="p-3 md:p-4 border-t border-slate-800/80 bg-slate-950">
        <div class="max-w-4xl mx-auto relative bg-slate-900/90 border border-slate-800 focus-within:border-cyan-500/60 rounded-2xl p-2 transition shadow-xl">
          <textarea id="userInput" rows="1" placeholder="Ask JARVIS anything or request an image (e.g. 'Paint a watercolor cat')..." class="w-full bg-transparent text-slate-100 text-sm focus:outline-none resize-none px-3 py-1.5 max-h-40 placeholder-slate-500"></textarea>
          <div class="flex items-center justify-between pt-1 border-t border-slate-800/50 mt-1 px-2">
            <span class="text-[11px] text-slate-500 font-mono">JARVIS Engine</span>
            <button onclick="handleSendMessage()" class="bg-cyan-600 hover:bg-cyan-500 text-white p-1.5 rounded-xl transition shadow-md shadow-cyan-600/30">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
            </button>
          </div>
        </div>
        <p class="text-[10px] text-center text-slate-600 mt-2">JARVIS AI Assistant • Developed by Abdullah Waheed</p>
      </div>
    </main>
  </div>

  <!-- AUTHENTICATION MODAL -->
  <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-500 hover:text-slate-300">✕</button>
      
      <div class="text-center mb-6">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-bold flex items-center justify-center mx-auto mb-2">J</div>
        <h3 class="text-lg font-bold text-white">Account Sign In</h3>
        <p class="text-xs text-slate-400 mt-1">Sign in to save your conversation history across sessions.</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-medium text-slate-400 block mb-1">Email Address</label>
          <input id="authEmail" type="email" placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="text-[11px] font-medium text-slate-400 block mb-1">Password</label>
          <input id="authPassword" type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
        </div>
        <button onclick="handleEmailSignIn()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 rounded-xl text-xs transition shadow-lg shadow-cyan-600/20">
          Sign In / Create Account
        </button>
      </div>
    </div>
  </div>

  <!-- LOAD APP LOGIC -->
  <script src="code.js"></script>
</body>
</html>
